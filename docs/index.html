<title>AI Atlas — the AI world, 2012 → today</title>
<style>
:root{
  --bg:#0b1015; --panel:#121a22cc; --panel-solid:#131b23; --line:#26333f;
  --ink:#d8e2e8; --ink-dim:#8fa0ac; --ink-faint:#5c6b76;

  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Avenir Next",Seravek,system-ui,sans-serif;
  --serif:"Iowan Old Style",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--sans);overflow:hidden}
#gl,#overlay{position:absolute;inset:0;width:100%;height:100%}
#overlay{pointer-events:none}
#overlay .hit{pointer-events:auto;cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tlabel{position:absolute;transform:translate(-50%,-50%);
  font-family:var(--sans);font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:#ffffff2e;pointer-events:none;
  text-shadow:0 1px 6px #000a;white-space:nowrap}
.elabel{position:absolute;transform:translate(-50%,-130%);font-size:10.5px;
  font-weight:600;color:var(--ink);text-shadow:0 1px 4px #000d,0 0 10px #0008;
  pointer-events:none;white-space:nowrap;letter-spacing:.02em}
.elabel .sub{color:var(--ink-dim);font-weight:500}

#title{position:absolute;top:14px;left:16px;z-index:10}
#title h1{margin:0;font-family:var(--sans);font-weight:800;font-size:19px;
  letter-spacing:.28em}
#title .sub{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
#title .sub b{color:var(--gold);font-weight:600}
#aboutBtn{cursor:pointer;color:var(--ink-dim);border:1px solid var(--line);

  text-align:center;font-size:11px;margin-left:6px;vertical-align:2px}
#aboutBtn:hover{color:var(--gold);border-color:var(--gold)}

#readout{position:absolute;top:14px;right:16px;text-align:right;z-index:10;
  background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;min-width:210px}
#dateBig{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.02em}
#eraName{color:var(--gold);font-size:12px;font-weight:600;margin:1px 0 6px}
#eraReg{font-size:9.5px;color:var(--ink-faint);letter-spacing:.08em;

#stats{font-size:11px;color:var(--ink-dim);line-height:1.65;font-variant-numeric:tabular-nums}
#stats b{color:var(--ink);font-weight:600}

#leftrail{position:absolute;top:64px;left:16px;width:228px;z-index:10;
  display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 170px);
  overflow-y:auto;scrollbar-width:thin}
.panel{background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.panel h3{margin:0 0 6px;font-size:10px;letter-spacing:.18em;color:var(--ink-dim);
  font-weight:700;cursor:pointer;user-select:none}
.panel h3 .chev{float:right;transition:transform .2s}
.panel.closed .body{display:none}
.panel.closed h3 .chev{transform:rotate(-90deg)}
.chapter{padding:4px 6px;border-radius:5px;cursor:pointer;font-size:11.5px;
  display:flex;justify-content:space-between;gap:6px}
.chapter:hover{background:#ffffff10}
.chapter .yr{color:var(--ink-faint);font-family:var(--mono);font-size:10px}
.terr{display:flex;align-items:center;gap:7px;padding:2.5px 4px;font-size:11px;
  border-radius:4px;cursor:pointer}
.terr:hover{background:#ffffff10}
.terr .sw{width:9px;height:9px;border-radius:2px;flex:none}
.terr .n{color:var(--ink-faint);margin-left:auto;font-family:var(--mono);font-size:9.5px}
.lrow{display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;padding:2.5px 0;cursor:pointer}
.sw2{width:26px;height:14px;background:#2a3742;border-radius:8px;position:relative;
  transition:background .15s}
.sw2:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;
  background:#8fa0ac;top:2px;left:2px;transition:all .15s}
.lrow.on .sw2{background:var(--gold)}
.lrow.on .sw2:after{left:14px;background:#0b1015}

#search{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:11;width:min(430px,44vw)}
#q{width:100%;background:var(--panel);backdrop-filter:blur(10px);

#hits{background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;

.hit-row{padding:7px 11px;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:baseline}
.hit-row:hover,.hit-row.act{background:#ffffff12}

.frow{display:flex;gap:8px;font-size:11.5px;padding:2.5px 0;border-bottom:1px solid #ffffff0d}

#info .prose{font-size:12px;line-height:1.55;color:var(--ink-dim);margin:8px 0}

.b-high{background:#2e5f3e;color:#a9dfb9}.b-medium{background:#5d5426;color:#e7d78a}
.b-low{background:#5d3a26;color:#e7b08a}.b-contested{background:#5d2626;color:#e78a8a}
.b-stale{background:#333d46;color:#9fb2bf}
.posrow{font-size:10px;color:var(--ink-faint);margin-top:8px;font-style:italic}
.cite{font-size:10.5px;color:var(--ink-faint);margin-top:8px;border-top:1px solid var(--line);

.cite a{color:var(--blue);text-decoration:none;word-break:break-all}
.rel-list{font-size:11.5px}
.rel-list .r{padding:2px 0;cursor:pointer;color:var(--blue)}
.rel-list .r:hover{text-decoration:underline}

#spark{width:100%;height:44px;margin-top:4px}

#timeline{position:absolute;left:0;right:0;bottom:0;z-index:12;

#tstrip{width:100%;height:34px;display:block;cursor:crosshair}
#slider{width:100%;margin:2px 0 6px;-webkit-appearance:none;background:none;height:14px}
#slider::-webkit-slider-runnable-track{height:3px;background:#2a3742;border-radius:2px}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--gold);margin-top:-5.5px;border:2px solid #0b1015;
  box-shadow:0 0 8px #d9a44188}
#controls{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-dim)}
.btn{background:#1a242e;border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:4px 10px;cursor:pointer;font:11.5px var(--sans)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);color:#0b1015;border-color:var(--gold);font-weight:700}
select{background:#1a242e;border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:3px 6px;font:11px var(--sans)}

#about{position:absolute;inset:0;z-index:40;background:#0b1015f2;display:none;
  overflow-y:auto;padding:7vh 0}
#about .inner{max-width:680px;margin:0 auto;padding:0 28px;
  font-family:var(--serif);font-size:14.5px;line-height:1.65;color:var(--ink-dim)}
#about h1{font-family:var(--sans);letter-spacing:.24em;font-size:22px;color:var(--ink)}
#about h2{font-family:var(--sans);font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin:26px 0 8px}
#about .x{position:fixed;top:20px;right:28px;font-size:26px;cursor:pointer;
  color:var(--ink-dim)}
#about .x:hover{color:var(--ink)}
#about code{font-family:var(--mono);font-size:.85em;background:#1a242e;
  padding:1px 5px;border-radius:3px}
#about .ul{margin-top:24px;border-top:1px solid var(--line);padding-top:12px;
  font-size:12px;font-family:var(--sans)}

#splash{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
#splash .t{font-family:var(--sans);font-weight:800;letter-spacing:.34em;font-size:22px}
#splash .s{color:var(--ink-faint);font-size:11.5px;font-family:var(--mono)}
#bar{width:210px;height:2px;background:#1a242e}#bar i{display:block;height:100%;
  background:var(--gold);width:0%;transition:width .2s}

@media (max-width:860px){#leftrail{display:none}#info{width:270px;right:8px}
#search{width:56vw}}
</style>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 uv; out vec4 frag;
uniform sampler2D uTerrain, uHeatA, uHeatB;
uniform float uMix, uTimeS, uAspect, uHorizon, uZoom;
uniform vec2 uCenter;
uniform vec3 uEraTint;
uniform vec4 uLay;               /* x terrain, y attention, z horizonGhost, w unused */
uniform vec3 uPal[13];
const float NT = 13.0;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int k=0;k<4;k++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; }
  return v;
}
/* decode sqrt-encoded channel, then mix — decode-then-mix, never the reverse */
float dec(float v){ return v*v; }

vec3 terrAt(vec2 w){ return texture(uTerrain, w).rgb; }
float elevAt(vec2 w, vec3 heat){
  float bed = dec(texture(uTerrain, w).r);
  return 0.42*bed + 0.95*heat.g;
}

void main(){
  /* world coords: pan/zoom about centre, aspect-corrected */
  vec2 w = (uv - 0.5)*vec2(uAspect,1.0)/uZoom + uCenter;
  if(w.x<0.0||w.x>1.0||w.y<0.0||w.y>1.0){
    float d = max(max(-w.x, w.x-1.0), max(-w.y, w.y-1.0));
    vec3 edge = vec3(0.028,0.037,0.048)*(1.0-clamp(d*2.2,0.0,0.6));
    frag = vec4(edge,1.0); return;
  }
  vec3 T = terrAt(w);
  vec3 hA = texture(uHeatA, w).rgb, hB = texture(uHeatB, w).rgb;
  vec3 heat = vec3(mix(dec(hA.r),dec(hB.r),uMix), mix(dec(hA.g),dec(hB.g),uMix),
                   mix(dec(hA.b),dec(hB.b),uMix));

  int tid = int(clamp(floor(T.g*255.0/19.0 + 0.5), 0.0, NT-1.0));
  vec3 hue = uPal[tid];

  /* ground: abyssal ink where the corpus is silent, rising parchment-dark
     land where it is dense (frozen datum = stable material coordinate) */
  float grain = fbm(w*340.0 + float(tid)*7.31)*0.5 + fbm(w*90.0)*0.5;
  vec3 abyss = vec3(0.030,0.042,0.058) + (grain-0.5)*0.012;
  float bedv = dec(T.r);
  float landmass = smoothstep(0.008, 0.30, bedv);
  vec3 ground = vec3(0.125,0.130,0.135) + hue*0.24 + (grain-0.5)*0.045;
  vec3 col = mix(abyss, ground, landmass);
  /* coastline: a brightened shore where land meets the abyss */
  float shore = smoothstep(0.008,0.06,bedv)*(1.0-smoothstep(0.06,0.22,bedv));
  col += vec3(0.10,0.11,0.12)*shore*0.5;

  /* settlement raises and saturates the land — the world builds over time */
  float land = clamp(heat.g*1.25, 0.0, 1.0);
  col = mix(col, hue*0.50 + vec3(0.055,0.058,0.062), land*0.66);

  /* hillshade from composite elevation, light from NW */
  float e  = elevAt(w, heat);
  vec2 px = vec2(1.0/512.0);
  float ex = elevAt(w+vec2(px.x,0.0), vec3(0,heat.g,0)) - elevAt(w-vec2(px.x,0.0), vec3(0,heat.g,0));
  float ey = elevAt(w+vec2(0.0,px.y), vec3(0,heat.g,0)) - elevAt(w-vec2(0.0,px.y), vec3(0,heat.g,0));
  vec3 n = normalize(vec3(-ex*34.0, -ey*34.0, 1.0));
  float lit = clamp(dot(n, normalize(vec3(-0.55,0.62,0.75))), 0.0, 1.0);
  col *= 0.76 + 0.50*lit;

  /* slope-gated micro relief so zoom reveals structure, not blur */
  float slope = clamp(length(vec2(ex,ey))*40.0, 0.0, 1.0);
  float micro = fbm(w*(900.0+uZoom*140.0) + float(tid)*3.7);
  col *= 1.0 + (micro-0.5)*0.14*(0.25+slope);

  /* contours on elevation, fading when flat */
  float lev = fract(e*14.0);
  float cw = fwidth(e*14.0)*1.4;
  float cont = 1.0 - smoothstep(0.0, cw, min(lev, 1.0-lev));
  col *= 1.0 - cont*0.10*(0.3+0.7*slope);

  /* territory borders from the margin channel */
  float border = 1.0 - smoothstep(0.015, 0.10, T.b);
  col = mix(col, vec3(0.020,0.026,0.034), border*0.55*clamp(bedv*2.0,0.2,1.0));
  col += hue*border*0.05;

  /* attention: warm luminance + slow heat-shimmer whose amplitude IS the value */
  if(uLay.y > 0.5){
    float A = heat.r;
    float shim = vnoise(w*260.0 + vec2(0.0, uTimeS*0.05))*0.35 + 0.65;
    vec3 glow = vec3(1.00,0.62,0.28)*A*shim*0.42 + vec3(1.0,0.85,0.55)*A*A*0.34;
    col += glow;
    col += vec3(1.0,0.35,0.18)*heat.b*0.50;    /* freshness: today's strikes */
  }

  /* era ambient light, subtle */
  col *= mix(vec3(1.0), uEraTint, 0.16);

  /* pre-horizon register: reconstructed eras render dimmer and cooler */
  col = mix(col, col*vec3(0.72,0.78,0.86)+vec3(0.004), uHorizon*0.55);

  /* graticule + vignette */
  vec2 g = abs(fract(w*10.0)-0.5);
  float grid = 1.0 - smoothstep(0.0, 0.012, min(g.x,g.y)*0.1/max(uZoom,1.0));
  col += vec3(0.5,0.6,0.7)*grid*0.016;
  vec2 vd = uv-0.5; col *= 1.0 - dot(vd,vd)*0.38;

  frag = vec4(col, 1.0);
}
</script>
</head>

<canvas id="gl"></canvas>
<svg id="overlay"></svg>
<div id="labels"></div>

<div id="title">

<script>
"use strict";
/* ========================================================================
   AI Atlas — engine. One scalar t (days since 2012-01-01) drives everything.
   state → render(state); no hidden clocks. Substrate: WebGL2 quad composing
   terrain + interpolated heat keyframes. Features: SVG, windowed by t.
   ======================================================================== */
const DATA_V = "20260731-0207";
const EPOCH = Date.UTC(2012,0,1);
const DAY = 86400000;
const HORIZON_T = (Date.UTC(2026,3,13)-EPOCH)/DAY;
const TODAY_T = Math.floor((Date.now()-EPOCH)/DAY);

const PAL = {  /* order = sorted territory names (frames discipline: shipped in territories.json) */
  "AI Adoption by Industry":            [0.66,0.63,0.35],
  "AI Industry & Markets":              [0.83,0.64,0.31],
  "AI Litigation, Liability & Enforcement":[0.76,0.36,0.36],
  "AI Safety, Alignment & Interpretability":[0.49,0.67,0.42],
  "AI Standards & Safety Frameworks":   [0.50,0.61,0.71],
  "Agentic AI & Coding":                [0.32,0.66,0.83],
  "Compute, Chips & Infrastructure":    [0.25,0.68,0.62],
  "Federal AI Policy & Agency Action":  [0.36,0.51,0.79],
  "Frontier Models & Capabilities":     [0.62,0.48,0.85],
  "International AI Regulation":        [0.44,0.45,0.79],
  "Labor, Society & Democratic Institutions":[0.75,0.48,0.60],
  "National Security & Geopolitics":    [0.54,0.59,0.66],
  "U.S. State AI Legislation":          [0.79,0.47,0.31],
};
const GLYPH = {companies:"c", models:"m", legislation:"l", litigation:"x",
  entities:"e", concepts:"o", government:"g", industries:"i", standards:"s",
  analysis:"a"};
const state = {
  t: 0, cx: 0.5, cy: 0.5, zoom: 1.0, playing: false, speed: 90,
  sel: null, layers: {terrain:1, attention:1, entities:1, arcs:0, strikes:1,
                      labels:1, horizon:0},
  terrFocus: null,
};
const D = {};            /* data */
let gl, prog, uni = {}, texCache = new Map(), quad;
let arcsLoaded = null, anchors = null;
const $ = id => document.getElementById(id);

/* ---------- time helpers ---------- */
const isoOf = t => new Date(EPOCH + t*DAY).toISOString().slice(0,10);
const tOf = iso => {
  const p = iso.split("-").map(Number);
  if (p.length === 3) return (Date.UTC(p[0],p[1]-1,p[2])-EPOCH)/DAY;
  if (p.length === 2) return (Date.UTC(p[0],p[1]-1,15)-EPOCH)/DAY;
  return (Date.UTC(p[0],6,1)-EPOCH)/DAY;
};
const fmtDate = t => new Date(EPOCH+t*DAY).toLocaleDateString("en-US",
  {year:"numeric",month:"long",day:"numeric",timeZone:"UTC"});

/* ---------- boot ---------- */
const files = ["meta","eras","entities","series","wikitime"];
let loaded = 0;
function note(s){ $("splashS").textContent = s; }
function prog_(){ loaded++; $("bar").firstElementChild.style.width =
  (100*loaded/(files.length+4))+"%"; }
const J = n => fetch("data/"+n+".json?v="+DATA_V).then(r=>{
  if(!r.ok) throw new Error(n); return r.json();}).then(d=>{prog_();return d;});

async function boot(){
  note("reading the vault…");
  const [meta, eras, ents, series, wikitime, territories] = await Promise.all([
    J("meta"), J("eras"), J("entities"), J("series"), J("wikitime"),
    J("territories")]);
  D.meta = meta; D.eras = eras.eras; D.series = series.series;
  D.ents = ents.entities; D.people = ents.people; D.terr = territories;
  D.byId = new Map(D.ents.map(e=>[e.id,e]));
  D.people.forEach(p=>D.byId.set(p.id,p));
  /* per-entity series, sorted */
  D.seriesBy = new Map();
  for (const r of D.series){
    if(!D.seriesBy.has(r.entity)) D.seriesBy.set(r.entity, []);
    D.seriesBy.get(r.entity).push({t:tOf(r.date.iso), v:r.usd_b, txt:r.text,
      g:r.group, iso:r.date.iso});
  }
  for (const a of D.seriesBy.values()) a.sort((x,y)=>x.t-y.t);
  /* wiki-time: first-known date per page */
  D.firstKnown = new Map();
  for (const op of wikitime.ops){
    if(!op.date) continue;
    const t = tOf(op.date.iso);
    for (const p of (op.created||[]).concat(op.updated||[]))
      if(!D.firstKnown.has(p) || t < D.firstKnown.get(p)) D.firstKnown.set(p,t);
  }
  D.wikiCum = [...D.firstKnown.values()].sort((a,b)=>a-b);
  /* entity windows in t */
  for (const e of D.ents){
    e.t0 = e.window ? tOf(e.window.iso) : null;
    e.sz = 1 + Math.log1p(e.indeg||0)*0.9;
  }
  note("reading the fields…");
  D.manifest = await fetch("fields/manifest.json?v="+DATA_V).then(r=>r.json());
  prog_();
  D.frames = D.manifest.keyframes.map(k=>({t:tOf(k.date), file:k.file}));
  note("composing the surface…");
  initGL(); prog_();
  state.t = TODAY_T;
  readHash();
  await ensureFrames(state.t, true); prog_();
  buildRail(); buildTimeline(); wireUI(); layoutTerrLabels();
  /* events + arcs arrive behind the first frame */
  J("events").then(d=>{ D.events = d.events;
    for (const ev of D.events) ev.t = tOf(ev.date.iso);
    D.events.sort((a,b)=>a.t-b.t);
    D.evT = D.events.map(e=>e.t);
    drawTimeline(); renderSVG(); });
  requestAnimationFrame(loop);
  $("splash").style.display = "none";
}

/* ---------- fields: lazy two-keyframe loader with re-centring prefetch ----- */
function frameAt(t){
  const f = D.frames;
  if (t <= f[0].t) return {i:0,j:0,mix:0};
  if (t >= f[f.length-1].t) return {i:f.length-1,j:f.length-1,mix:0};
  let lo=0, hi=f.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if (f[m].t<=t) lo=m; else hi=m; }
  return {i:lo, j:hi, mix:(t-f[lo].t)/(f[hi].t-f[lo].t)};
}
let inflight = 0, wantT = 0;
function texOf(idx){
  const f = D.frames[idx];
  if (!f) return null;
  const c = texCache.get(f.file);
  if (c){ c.at = performance.now(); return c.tex==="pending"?null:c.tex; }
  if (inflight >= 3) return null;
  inflight++;
  texCache.set(f.file, {tex:"pending", at:performance.now()});
  const img = new Image();
  img.onload = ()=>{ inflight--;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    texCache.set(f.file,{tex,at:performance.now()});
    if (texCache.size > 22) evict();
    pump();
  };
  img.onerror = ()=>{ inflight--; texCache.set(f.file,{tex:null,at:0}); pump(); };
  img.src = "fields/"+f.file+"?v="+DATA_V;
  return null;
}
function evict(){
  let oldest=null, ok=null;
  for (const [k,v] of texCache) if(v.tex && v.tex!=="pending" &&
    (!oldest || v.at<ok)) { oldest=k; ok=v.at; }
  if (oldest){ gl.deleteTexture(texCache.get(oldest).tex); texCache.delete(oldest); }
}
function pump(){       /* re-centres on every completion: nearest to NOW wins */
  const {i,j} = frameAt(wantT);
  const order = [];
  for (let d=0; d<7; d++){ if(i-d>=0) order.push(i-d); if(j+d<D.frames.length) order.push(j+d); }
  for (const idx of order){
    if (inflight >= 3) break;
    const f = D.frames[idx];
    if (!texCache.has(f.file)) texOf(idx);
  }
}
async function ensureFrames(t, block){
  wantT = t;
  const {i,j} = frameAt(t);
  texOf(i); texOf(j); pump();
  if (block){
    await new Promise(res=>{
      const chk=()=>{ const a=texCache.get(D.frames[i].file),
        b=texCache.get(D.frames[j].file);
        if(a&&a.tex&&a.tex!=="pending"&&b&&b.tex&&b.tex!=="pending") res();
        else setTimeout(chk,40); };
      chk();
    });
  }
}

/* ---------- WebGL ---------- */
function initGL(){
  const cv = $("gl");
  gl = cv.getContext("webgl2",{antialias:false});
  const sh = (t,src)=>{ const s=gl.createShader(t); gl.shaderSource(s,src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, $("vs").textContent.trim()));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $("fs").textContent.trim()));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,"p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  for (const n of ["uTerrain","uHeatA","uHeatB","uMix","uTimeS","uAspect",
    "uCenter","uZoom","uEraTint","uHorizon","uLay","uPal"])
    uni[n] = gl.getUniformLocation(prog,n);
  /* static terrain */
  const img = new Image();
  img.onload = ()=>{ const tex=gl.createTexture();
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); };
  img.src = "fields/terrain.png?v="+DATA_V;
  const pal = new Float32Array(39);
  D.terr.names.forEach((n,i)=>{ const c = PAL[n]||[0.5,0.5,0.5];
    pal[i*3]=c[0]; pal[i*3+1]=c[1]; pal[i*3+2]=c[2]; });
  gl.uniform3fv(uni.uPal, pal);
  gl.uniform1i(gl.getUniformLocation(prog,"uTerrain"),0);
  gl.uniform1i(gl.getUniformLocation(prog,"uHeatA"),1);
  gl.uniform1i(gl.getUniformLocation(prog,"uHeatB"),2);
}
function eraAt(t){
  for (const e of D.eras){
    const a=tOf(e.from), b=e.to?tOf(e.to):TODAY_T;
    if (t>=a && t<=b+0.5) return e;
  }
  return D.eras[D.eras.length-1];
}
const ERA_TINT = {["deep-learning"]:[0.85,0.92,1.06],transformer:[0.92,0.96,1.05],
  scaling:[0.97,0.99,1.03],["chatgpt-shock"]:[1.10,1.00,0.92],
  ["regulatory-response"]:[1.02,0.99,1.00],agentic:[1.00,1.02,1.03],
  convergence:[1.06,1.02,0.97]};
function renderGL(now){
  const cv = $("gl"), dpr = Math.min(devicePixelRatio||1, 2);
  const W = cv.clientWidth*dpr|0, H = cv.clientHeight*dpr|0;
  if (cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; gl.viewport(0,0,W,H); }
  const {i,j,mix} = frameAt(state.t);
  wantT = state.t;
  const a = texOf(i), b = texOf(j);
  if (a){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,a); }
  if (b||a){ gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,b||a); }
  gl.uniform1f(uni.uMix, b?mix:0);
  gl.uniform1f(uni.uTimeS, now/1000);
  gl.uniform1f(uni.uAspect, cv.clientWidth/cv.clientHeight);
  gl.uniform2f(uni.uCenter, state.cx, state.cy);
  gl.uniform1f(uni.uZoom, state.zoom);
  gl.uniform1f(uni.uHorizon, state.t < HORIZON_T ? 1:0);
  gl.uniform4f(uni.uLay, state.layers.terrain, state.layers.attention, 0, 0);
  const tint = ERA_TINT[eraAt(state.t).id]||[1,1,1];
  gl.uniform3f(uni.uEraTint, tint[0],tint[1],tint[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- projection ---------- */
function toScreen(p){
  const cv = $("gl"), W=cv.clientWidth, H=cv.clientHeight, asp=W/H;
  return [ (((p[0]-state.cx)*state.zoom)/asp + 0.5)*W,
           (1-(((p[1]-state.cy)*state.zoom) + 0.5))*H ];
}
function toWorld(x,y){
  const cv = $("gl"), W=cv.clientWidth, H=cv.clientHeight, asp=W/H;
  return [ (x/W-0.5)*asp/state.zoom + state.cx,
           (0.5-(y/H))/state.zoom + state.cy ];
}

/* ---------- features (SVG) ---------- */
const NS = "http://www.w3.org/2000/svg";
const HEDGE = /target|talks|seek|offer|weigh|rumor|project|potential|reported|near \$|as soon as|up to/i;
function usdAt(id, t, groupRe){
  /* one metric at a time: a $5B compute-commitment row must never roll
     forward over a $1T Valuation row (it did, on first render). And a
     HEDGED row — "$1.75T (SpaceX IPO target)" — never feeds a derived
     headline number (rule 2.15): it stays on the card, verbatim, where
     its qualifier travels with it. */
  const re = groupRe || /valuation/i;
  const s = D.seriesBy.get(id); if(!s) return 0;
  let v=0;
  for (const r of s){
    if (r.t>t) break;
    if (r.v && re.test(r.g||"") && !HEDGE.test(r.txt||"")) v=r.v;
  }
  return v;
}
function visibleEnts(t){
  const out = [];
  for (const e of D.ents){
    if (!e.pos) continue;
    if (state.terrFocus && e.territory!==state.terrFocus) continue;
    let alpha, bg=false;
    if (e.t0===null){ alpha=0.35; bg=true; }
    else if (e.t0<=t){ alpha=Math.min(1,(t-e.t0)/90*0.7+0.3); }
    else continue;
    if (state.layers.horizon){
      const fk = D.firstKnown.get(e.id);
      if (fk===undefined || fk>t) alpha *= 0.15;
    }
    out.push({e, alpha, bg});
  }
  return out;
}
function glyphPath(folder, r){
  switch(GLYPH[folder]){
    case "m": return "M0 "+(-r*1.25)+" L"+(r*1.1)+" "+(r*0.9)+" L"+(-r*1.1)+" "+(r*0.9)+" Z";
    case "l": return "M"+(-r*0.8)+" "+(-r)+" h"+(r*1.6)+" v"+(2*r)+" h"+(-r*1.6)+" Z";
    case "x": return "M0 "+(-r*1.2)+" L"+(r*1.2)+" 0 L0 "+(r*1.2)+" L"+(-r*1.2)+" 0 Z";
    case "s": return "M"+(-r*0.7)+" "+(-r*0.7)+" h"+(r*1.4)+" v"+(r*1.4)+" h"+(-r*1.4)+" Z";
    case "g": return "M0 "+(-r*1.2)+" L"+(r*1.15)+" "+(-r*0.35)+" L"+(r*0.7)+" "+(r*1.05)+" L"+(-r*0.7)+" "+(r*1.05)+" L"+(-r*1.15)+" "+(-r*0.35)+" Z";
    default: return null;              /* circle */
  }
}
let svgDirty = true;
function renderSVG(){
  svgDirty = false;
  const svg = $("overlay");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const t = state.t;
  const W = svg.clientWidth, H = svg.clientHeight;

  /* strikes: events in the trailing 21 days */
  if (state.layers.strikes && D.events){
    let lo = bisect(D.evT, t-10), hi = bisect(D.evT, t+0.001);
    const g = document.createElementNS(NS,"g");
    for (let k=lo;k<hi;k++){
      const ev = D.events[k];
      if (!ev.pos) continue;
      const [x,y] = toScreen(ev.pos);
      if (x<-40||y<-40||x>W+40||y>H+40) continue;
      const age = t - ev.t;
      const r = 3 + age*1.1, al = Math.max(0, 0.6*(1-age/10));
      const c = document.createElementNS(NS,"circle");
      c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",r);
      c.setAttribute("fill","none");
      c.setAttribute("stroke", ev.update?"#d9a441":"#e8734a");
      c.setAttribute("stroke-width", age<2?1.6:0.9);
      c.setAttribute("opacity", al);
      c.setAttribute("class","hit");
      c.addEventListener("click",()=>showEvent(ev));
      g.appendChild(c);
    }
    svg.appendChild(g);
  }

  /* entities */
  if (state.layers.entities){
    const vis = visibleEnts(t);
    const g = document.createElementNS(NS,"g");
    for (const {e,alpha,bg} of vis){
      const [x,y] = toScreen(e.pos);
      if (x<-30||y<-30||x>W+30||y>H+30) continue;
      const grow = e.folder==="companies" ? Math.log1p(usdAt(e.id,t))*0.55 : 0;
      const r = (e.sz + grow) * Math.min(1.6, 0.75+state.zoom*0.28);
      const hue = PAL[e.territory]||[0.6,0.6,0.6];
      const col = "rgb("+((hue[0]*255+40)|0)+","+((hue[1]*255+40)|0)+","+((hue[2]*255+40)|0)+")";
      const path = glyphPath(e.folder, r);
      let el;
      if (path){ el = document.createElementNS(NS,"path");
        el.setAttribute("d", path);
        el.setAttribute("transform","translate("+x+" "+y+")");
      } else { el = document.createElementNS(NS,"circle");
        el.setAttribute("cx",x); el.setAttribute("cy",y);
        el.setAttribute("r", e.folder==="concepts"?r*0.62:r);
      }
      el.setAttribute("fill", e.folder==="concepts"||bg ? "none" : col);
      el.setAttribute("stroke", col);
      el.setAttribute("stroke-width", bg?0.7:1.1);
      el.setAttribute("opacity", alpha*(e.folder==="concepts"?0.7:0.92));
      el.setAttribute("class","hit");
      el.addEventListener("click",(evc)=>{ evc.stopPropagation(); select(e.id); });
      g.appendChild(el);
      if (e.folder==="companies" && grow>0.8){
        const ring = document.createElementNS(NS,"circle");
        ring.setAttribute("cx",x); ring.setAttribute("cy",y);
        ring.setAttribute("r", r+2.4);
        ring.setAttribute("fill","none"); ring.setAttribute("stroke",col);
        ring.setAttribute("stroke-width",0.6);
        ring.setAttribute("opacity",alpha*0.5);
        g.appendChild(ring);
      }
    }
    svg.appendChild(g);
  }

  /* arcs: selection always; global when layer on and zoomed */
  if (D.arcs && (state.sel || (state.layers.arcs && state.zoom>1.8))){
    const g = document.createElementNS(NS,"g");
    let list = [];
    if (state.sel) list = D.arcs.filter(a=>a.src===state.sel||a.dst===state.sel);
    else list = D.arcs.filter((a,i)=> i%7===0 );
    let n=0;
    for (const a of list){
      if (n>240) break;
      const s = D.byId.get(a.src), d2 = D.byId.get(a.dst);
      if (!s||!d2||!s.pos||!d2.pos) continue;
      if (s.t0 && s.t0>t) continue;
      if (d2.t0 && d2.t0>t) continue;
      const A = toScreen(s.pos), B = toScreen(d2.pos);
      const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2 - Math.min(60, Math.hypot(B[0]-A[0],B[1]-A[1])*0.22);
      const p = document.createElementNS(NS,"path");
      p.setAttribute("d","M"+A[0]+" "+A[1]+" Q"+mx+" "+my+" "+B[0]+" "+B[1]);
      p.setAttribute("fill","none");
      const contra = a.type==="contradicts";
      p.setAttribute("stroke", contra?"#c25b5b":"#6f9fd8");
      if (contra) p.setAttribute("stroke-dasharray","4 3");
      p.setAttribute("stroke-width", state.sel?1.1:0.5);
      p.setAttribute("opacity", state.sel?0.65:0.16);
      g.appendChild(p); n++;
    }
    svg.appendChild(g);
  }

  /* selection ring */
  if (state.sel){
    const e = D.byId.get(state.sel);
    if (e && e.pos){
      const [x,y] = toScreen(e.pos);
      const c = document.createElementNS(NS,"circle");
      c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",13);
      c.setAttribute("fill","none"); c.setAttribute("stroke","#fff");
      c.setAttribute("stroke-width",1.2); c.setAttribute("opacity",0.85);
      c.setAttribute("stroke-dasharray","3 3");
      svg.appendChild(c);
    }
  }
  layoutEntLabels();
}
function bisect(arr, x){
  let lo=0, hi=arr.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<x) lo=m+1; else hi=m; }
  return lo;
}

/* ---------- labels ---------- */
function layoutTerrLabels(){
  for (const el of document.querySelectorAll(".tlabel")) el.remove();
  const box = $("labels");
  for (const n of D.terr.names){
    const c = D.terr.centroids[n]; if(!c) continue;
    const el = document.createElement("div");
    el.className="tlabel"; el.dataset.n = n;
    el.textContent = n.replace("AI ","").replace(" & ","  ·  ").toUpperCase();
    box.appendChild(el);
  }
  posTerrLabels();
}
function posTerrLabels(){
  const W = innerWidth, H = innerHeight;
  const taken = [];
  for (const el of document.querySelectorAll(".tlabel")){
    const c = D.terr.centroids[el.dataset.n];
    const [x,y] = toScreen(c);
    el.style.left = x+"px"; el.style.top = y+"px";
    el.style.fontSize = Math.min(15, 8+state.zoom*3.2)+"px";
    let show = !(x<-150||y<-40||x>W+150||y>H+40);
    if (show){                       /* collision-cull, drop not overdraw */
      const w = el.textContent.length*7.5;
      if (taken.some(r=>Math.abs(r[0]-x)<(r[2]+w)/2 && Math.abs(r[1]-y)<20))
        show = false;
      else taken.push([x,y,w]);
    }
    el.style.display = show?"":"none";
  }
}
let entLabelTimer = 0;
function layoutEntLabels(){
  const now = performance.now();
  if (now - entLabelTimer < 140) return;
  entLabelTimer = now;
  for (const el of document.querySelectorAll(".elabel")) el.remove();
  if (!state.layers.labels || state.zoom < 1.5) return;
  const t = state.t, W=innerWidth, H=innerHeight;
  const vis = visibleEnts(t)
    .map(v=>({...v, s: v.e.sz + (v.e.folder==="companies"?Math.log1p(usdAt(v.e.id,t)):0)}))
    .sort((a,b)=>b.s-a.s).slice(0, 8+state.zoom*14|0);
  const taken = [];
  const box = $("labels");
  for (const {e} of vis){
    const [x,y] = toScreen(e.pos);
    if (x<0||y<30||x>W||y>H-90) continue;
    const w = e.title.length*5.6+10;
    if (taken.some(r=>Math.abs(r[0]-x)<(r[2]+w)/2 && Math.abs(r[1]-y)<16)) continue;
    taken.push([x,y,w]);
    const el = document.createElement("div");
    el.className = "elabel";
    el.style.left=x+"px"; el.style.top=y+"px";
    el.textContent = e.title.length>34 ? e.title.slice(0,32)+"…" : e.title;
    box.appendChild(el);
  }
}

/* ---------- cards ---------- */
const FACTS = {
  companies: [["company_type","Type"],["founded","Founded"],["hq_country","HQ"]],
  models: [["developer","Developer"],["release_date","Released"],
           ["parameters","Parameters"],["open_weights","Open weights"]],
  litigation: [["court","Court"],["filed","Filed"],["last_status_check","Status checked"]],
  entities: [["entity_type","Type"]],
  legislation: [], concepts: [], government: [["entity_type","Type"]],
  industries: [], standards: [], analysis: [],
};
function decayState(e){
  if (!e.updated) return null;
  const age = (TODAY_T - tOf(e.updated))/30.4;
  return age > e.decay_months ? "stale ("+Math.round(age)+" mo)" : null;
}
function select(id){
  state.sel = id; svgDirty = true;
  const e = D.byId.get(id);
  if (!e){ $("info").style.display="none"; return; }
  if (!D.arcs) lazyArcs();
  const box = $("info");
  const conf = e.confidence||"medium";
  const stale = decayState(e);
  let h = "<div class=eyebrow><span>"+e.folder+
    (e.territory?" · "+esc(e.territory):"")+
    "</span><span class=close onclick=\"APP.close()\">×</span></div>"+
    "<h2>"+esc(e.title)+"</h2>"+
    "<div style=\"display:flex;gap:6px;flex-wrap:wrap\">"+
    "<span class=\"badge b-"+conf+"\">"+conf+"</span>"+
    (stale?"<span class=\"badge b-stale\">"+stale+"</span>":"")+
    (e.status && e.status!=="active"?"<span class=\"badge b-stale\">"+esc(e.status)+"</span>":"")+
    "</div>";
  const rows = (FACTS[e.folder]||[]).map(([k,lab])=>
    e.fact && e.fact[k]!==undefined ?
    "<div class=frow><span class=k>"+lab+"</span><span class=v>"+esc(String(e.fact[k]))+"</span></div>" : "").join("");
  h += rows;
  if (e.window) h += "<div class=frow><span class=k>Since</span><span class=v>"+
    e.window.iso+" <span style=\"color:var(--ink-faint)\">("+e.window.kind+
    (e.window.precision!=="day"?", "+e.window.precision:"")+")</span></span></div>";

function drawSpark(id){
  const cv = $("spark"); if(!cv) return;
  const all = (D.seriesBy.get(id)||[]).filter(r=>r.v);
  let s = all.filter(r=>/valuation/i.test(r.g||""));
  if (s.length<2) s = all.filter(r=>/revenue|arr/i.test(r.g||""));
  if (s.length<2){ cv.remove(); return; }
  const g = cv.getContext("2d"), W=cv.width=cv.clientWidth*2, H=cv.height=88;
  const t0=s[0].t, t1=s[s.length-1].t, vmax=Math.max(...s.map(r=>r.v));
  g.strokeStyle="#d9a441"; g.lineWidth=2; g.beginPath();
  s.forEach((r,i)=>{ const x=(r.t-t0)/(t1-t0||1)*(W-8)+4,
    y=H-6-(r.v/vmax)*(H-14);
    i?g.lineTo(x,y):g.moveTo(x,y); });
  g.stroke();
  const tx=(Math.min(state.t,t1)-t0)/(t1-t0||1)*(W-8)+4;
  g.strokeStyle="#ffffff55"; g.lineWidth=1;
  g.beginPath(); g.moveTo(tx,4); g.lineTo(tx,H-4); g.stroke();
}

/* ---------- lazy data ---------- */
function lazyArcs(){
  if (arcsLoaded) return arcsLoaded;
  arcsLoaded = J("arcs").then(d=>{ D.arcs=d.arcs; svgDirty=true;
    if(state.sel) fillRelated(state.sel); });
  return arcsLoaded;

let anchorsP = null;
function lazyAnchors(){
  if (anchorsP) return anchorsP;
  anchorsP = J("anchors50").then(d=>{ anchors = d; });
  return anchorsP;
}
async function neighbors(id){
  await lazyAnchors();
  const me = anchors.pages[id];
  if (!me) return [];
  const out = [];
  for (const [k,v] of Object.entries(anchors.pages)){
    if (k===id || !D.byId.has(k)) continue;
    let dot=0, na=0, nb=0;
    for (let i=0;i<50;i++){ dot+=me.v[i]*v.v[i]; na+=me.v[i]*me.v[i]; nb+=v.v[i]*v.v[i]; }
    out.push([dot/Math.sqrt(na*nb||1), k]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,6).map(x=>x[1]);
}

/* ---------- camera ---------- */
let flyAnim = null;
function flyTo(p, zoom){
  const from = {cx:state.cx, cy:state.cy, z:state.zoom};
  const to = {cx:p[0], cy:p[1], z:zoom||state.zoom};
  const t0 = performance.now();
  flyAnim = (now)=>{
    const u = Math.min(1,(now-t0)/650), e = u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    state.cx = from.cx+(to.cx-from.cx)*e;
    state.cy = from.cy+(to.cy-from.cy)*e;
    state.zoom = from.z+(to.z-from.z)*e;
    svgDirty = true;
    if (u>=1) flyAnim=null;
  };
}
function wireCamera(){
  const cv = $("gl");
  let drag=null;
  cv.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,
    cx:state.cx,cy:state.cy,moved:false}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove",e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    const asp=cv.clientWidth/cv.clientHeight;
    state.cx = drag.cx - dx/cv.clientWidth*asp/state.zoom;
    state.cy = drag.cy + dy/cv.clientHeight/state.zoom;
    clampView(); svgDirty=true;
  });
  cv.addEventListener("pointerup",e=>{
    if(drag && !drag.moved){
      /* click empty ground: nearest entity within 14px else deselect */
      const t=state.t;
      let best=null,bd=14;
      for (const {e:en} of visibleEnts(t)){
        const [x,y]=toScreen(en.pos);
        const d=Math.hypot(x-e.clientX,y-e.clientY);
        if(d<bd){bd=d;best=en.id;}
      }
      if (best) select(best); else APP.close();
    }
    drag=null;
  });
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    const w0 = toWorld(e.clientX,e.clientY);
    state.zoom = Math.max(0.85, Math.min(9, state.zoom*Math.exp(-e.deltaY*0.0016)));
    const w1 = toWorld(e.clientX,e.clientY);
    state.cx += w0[0]-w1[0]; state.cy += w0[1]-w1[1];
    clampView(); svgDirty=true;
  },{passive:false});
}
function clampView(){
  const m = 0.5/state.zoom;
  state.cx = Math.max(0.5-m*1.4, Math.min(0.5+m*1.4, state.cx));
  state.cy = Math.max(0.5-m*1.2, Math.min(0.5+m*1.2, state.cy));
}

function buildTimeline(){
  const s = $("slider");
  s.min = 0; s.max = TODAY_T; s.value = state.t;
  s.addEventListener("input", ()=> setT(+s.value, true));
  $("play").addEventListener("click", ()=>{ state.playing=!state.playing;
    $("play").textContent = state.playing?"❚❚":"▶"; });
  $("speed").addEventListener("change", e=> state.speed=+e.target.value);
  $("stepB").addEventListener("click", ()=>setT(state.t-30.44));
  $("stepF").addEventListener("click", ()=>setT(state.t+30.44));
  $("today").addEventListener("click", ()=>setT(TODAY_T));
  $("tstrip").addEventListener("click", e=>{
    const r = e.target.getBoundingClientRect();
    setT((e.clientX-r.left)/r.width*TODAY_T);
  });
  drawTimeline();
}
function drawTimeline(){
  const cv = $("tstrip"), g = cv.getContext("2d");
  const W = cv.width = cv.clientWidth*2, H = cv.height = 68;
  g.clearRect(0,0,W,H);
  /* era bands */
  for (const e of D.eras){
    const a = tOf(e.from)/TODAY_T*W, b = (e.to?tOf(e.to):TODAY_T)/TODAY_T*W;
    const tint = ERA_TINT[e.id]||[1,1,1];
    g.fillStyle = "rgba("+(tint[0]*80|0)+","+(tint[1]*70|0)+","+(tint[2]*90|0)+",0.55)";
    g.fillRect(a, H-14, b-a, 10);
  }
  /* event density per fortnight */
  if (D.events){
    const bins = new Float32Array(Math.ceil(TODAY_T/14)+1);
    for (const ev of D.events) bins[ev.t/14|0]++;
    const mx = Math.max(...bins)||1;
    g.fillStyle = "#e8734a";
    for (let i=0;i<bins.length;i++){
      const h = Math.pow(bins[i]/mx, 0.5)*(H-22);
      if (h>0.5) g.fillRect(i*14/TODAY_T*W, H-16-h, Math.max(1.5,14/TODAY_T*W), h);
    }
  }
  /* horizon marker */
  g.strokeStyle="#d9a44188"; g.setLineDash([4,3]); g.lineWidth=2;
  g.beginPath(); g.moveTo(HORIZON_T/TODAY_T*W, 2); g.lineTo(HORIZON_T/TODAY_T*W, H-4);
  g.stroke(); g.setLineDash([]);
  /* year ticks */
  g.fillStyle="#5c6b76"; g.font="16px "+getComputedStyle(document.body)
    .getPropertyValue("--mono");
  for (let y=2012; y<=2026; y+=2){
    const x = tOf(y+"-01-01")/TODAY_T*W;
    g.fillRect(x, H-20, 1, 6);
    g.fillText(String(y), x+3, H-24);
  }
  /* cursor */
  const x = state.t/TODAY_T*W;
  g.fillStyle="#d9a441"; g.fillRect(x-1,0,2,H-2);
}
function setT(t, fromSlider){
  state.t = Math.max(0, Math.min(TODAY_T, t));
  if (!fromSlider) $("slider").value = state.t;
  svgDirty = true;
  ensureFrames(state.t);
  writeHash();
}

/* ---------- hash ---------- */
function writeHash(){
  const h = "#d="+isoOf(state.t)+
    (state.sel?"&sel="+encodeURIComponent(state.sel):"")+
    "&v="+state.cx.toFixed(3)+","+state.cy.toFixed(3)+","+state.zoom.toFixed(2);
  history.replaceState(null,"",h);
}
function readHash(){
  const m = location.hash.match(/d=(\d{4}-\d{2}-\d{2})/);
  if (m) state.t = tOf(m[1]);
  const v = location.hash.match(/v=([\d.]+),([\d.]+),([\d.]+)/);
  if (v){ state.cx=+v[1]; state.cy=+v[2]; state.zoom=+v[3]; }
  const s = location.hash.match(/sel=([^&]+)/);
  if (s) setTimeout(()=>select(decodeURIComponent(s[1])), 400);
}

/* ---------- loop ---------- */
let lastNow = 0, lastReadout = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1,(now-lastNow)/1000); lastNow = now;
  if (flyAnim) flyAnim(now);
  if (state.playing){
    state.t += state.speed*dt;
    if (state.t >= TODAY_T){ state.t = TODAY_T; state.playing=false;
      $("play").textContent="▶"; }
    $("slider").value = state.t;
    svgDirty = true;
    ensureFrames(state.t);
  }
  renderGL(now);
  if (svgDirty){ renderSVG(); posTerrLabels(); drawTimeline(); }
  if (now-lastReadout>120){ updateReadout(); lastReadout=now; }
}

      $("about").style.display="block"; };
    if (D.updatelog===undefined){
      fetch("data/updatelog.json?v="+DATA_V).then(r=>r.ok?r.json():null)
        .then(d=>{ D.updatelog=d; show(); }).catch(()=>{D.updatelog=null;show();});
    } else show(); });
  $("aboutX").addEventListener("click",()=>$("about").style.display="none");
  document.addEventListener("keydown",e=>{
    if (e.target.tagName==="INPUT" && e.target.type!=="range") return;
    if (e.key===" "){ e.preventDefault(); $("play").click(); }
    if (e.key==="ArrowLeft") setT(state.t-(e.shiftKey?365:30.44));
    if (e.key==="ArrowRight") setT(state.t+(e.shiftKey?365:30.44));
    if (e.key==="Escape"){ $("about").style.display="none"; APP.close(); }
  });
  addEventListener("resize", ()=>{ svgDirty=true; });
  addEventListener("hashchange", readHash);
}

/* ---------- verification harness ---------- */
window.APP = {
  state, D,
  setDate(iso){ setT(tOf(iso)); },
  select, close(){ state.sel=null; $("info").style.display="none";
    svgDirty=true; writeHash(); },
  probe(x,y){ const px=new Uint8Array(4);
    const cv=$("gl"), dpr=Math.min(devicePixelRatio||1,2);
    gl.readPixels(x*dpr|0,(cv.clientHeight-y)*dpr|0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    return [...px]; },
  snap(){ renderGL(performance.now()); return $("gl").toDataURL("image/png"); },
  flyTo, frameAt: ()=>frameAt(state.t),
};

boot().catch(e=>{ note("failed: "+e.message); console.error(e); });
</script>
